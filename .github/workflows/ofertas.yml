name: Ofertas Mercado Livre

# Cada execução fica ligada ~5h40 postando a cada 10 minutos (alinhado no relógio).
# A agenda abaixo só serve para "passar o bastão": a cada 3 h o GitHub enfileira
# uma nova execução, que começa assim que a atual termina. Assim os atrasos da
# agenda do GitHub não deixam o canal parado.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só testar (1 rodada, mostra as ofertas no log, NÃO posta no Telegram)'
        type: boolean
        default: true

permissions:
  contents: write   # gravar o estado criptografado no branch "estado"
  actions: write    # manter a agenda ativa (o GitHub pausa agendas paradas há 60 dias)

concurrency:
  group: ofertas
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixar estado
        run: |
          set +e
          git ls-remote --exit-code --heads origin estado > /dev/null
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            git fetch --depth=1 origin estado
            git show FETCH_HEAD:estado.enc > estado.enc
            echo "Estado carregado."
          elif [ "$rc" = "2" ]; then
            echo "Primeira execução: ainda não há estado."
          else
            echo "::error::Não consegui consultar o branch estado (rc=$rc)."
            exit 1
          fi

      - name: Postar ofertas a cada 10 minutos
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_AUTH_CODE: ${{ secrets.ML_AUTH_CODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ESTADO_SENHA: ${{ secrets.ESTADO_SENHA }}
          MODO_TESTE: ${{ github.event_name == 'workflow_dispatch' && inputs.teste || 'false' }}
          GH_TOKEN: ${{ github.token }}
          INTERVALO_MIN: 10
          DURACAO_MIN: 340
        run: |
          salvar_estado() {
            [ -f estado.enc ] || return 0
            rm -rf /tmp/estado && mkdir -p /tmp/estado && cp estado.enc /tmp/estado/
            (
              cd /tmp/estado
              git init -q -b estado
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add estado.enc
              git commit -q -m "estado"
              for i in 1 2 3; do
                git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" estado && exit 0
                sleep 5
              done
              echo "::warning::Não consegui salvar o estado nesta rodada."
            )
          }

          INICIO=$(date +%s)
          while :; do
            echo "=== Rodada $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') ==="
            node ofertas.js || echo "::warning::A rodada falhou; tento de novo na próxima."
            salvar_estado
            [ "$MODO_TESTE" = "true" ] && break
            AGORA=$(date +%s)
            [ $((AGORA - INICIO)) -ge $((DURACAO_MIN * 60)) ] && break
            PASSO=$((INTERVALO_MIN * 60))
            sleep $((PASSO - AGORA % PASSO + 5))
          done

      - name: Manter a agenda ativa
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable ofertas.yml -R "$GITHUB_REPOSITORY" || true
